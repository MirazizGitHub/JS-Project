<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aspect Ratio Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:420px;
    background:#1e293b;
    color:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:13px;
    background:#3b82f6;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#2563eb;
}

.result{
    margin-top:20px;
    background:#334155;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-size:20px;
}
</style>

</head>
<body>

<div class="card">
    <h2>Aspect Ratio Calculator</h2>

    <label>Original Width</label>
    <input id="ow" type="number" value="1682">

    <label>Original Height</label>
    <input id="oh" type="number" value="427">

    <label>New Width</label>
    <input id="nw" type="number" value="1000">

    <button onclick="calc()">Hisoblash</button>

    <div class="result" id="result">
        Height: 254 px
    </div>
</div>

<script>
function calc(){
    const ow = parseFloat(document.getElementById("ow").value);
    const oh = parseFloat(document.getElementById("oh").value);
    const nw = parseFloat(document.getElementById("nw").value);

    if(!ow || !oh || !nw){
        document.getElementById("result").innerHTML = "Qiymatlarni kiriting!";
        return;
    }

    const nh = (oh / ow) * nw;

    document.getElementById("result").innerHTML =
        `Yangi o'lcham: <b>${nw} × ${nh.toFixed(2)}</b> px`;
}
</script>

</body>
</html>
